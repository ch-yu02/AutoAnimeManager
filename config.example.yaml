app:
  host: 127.0.0.1
  port: 8765
  log_level: INFO
  timezone: Asia/Shanghai

database:
  url: sqlite:///./data/database/autoanime.db

bangumi:
  base_url: https://api.bgm.tv
  username: ""
  access_token: ""
  timeout: 10
  page_size: 50
  cache_ttl_seconds: 30
  # Bangumi 同步的全局请求并发上限；过高可能触发 API 限流。
  sync_concurrency: 6
  metadata_refresh_hours: 24
  relations_refresh_hours: 168

qbittorrent:
  base_url: http://127.0.0.1:8080
  username: ""
  password: ""
  category: autoanime
  timeout: 10
  poll_interval_seconds: 3

release_search:
  provider: kisssub_rss
  # 根据 Bangumi 条目名称自动生成专属 RSS，不需要逐条维护链接。
  rss_url_template: https://www.kisssub.org/rss-{query}.xml
  # rss_url 仅在 rss_url_template 留空时作为固定 RSS 使用。
  rss_url: https://www.kisssub.org/rss.xml
  timeout: 15
  max_results: 100
  # 自动尝试中文名、原名和 Bangumi aliases，避免站点关键词差异需要手工映射。
  max_query_terms: 3
  preferred_groups: []
  preferred_language: ""
  preferred_resolution: 1080p
  preferred_codec: ""
  allow_batch: false
  # 内部调试开关；开启后客户端才显示“调试自动选择”。
  debug_auto_selection_enabled: false

player:
  progress_save_interval_seconds: 15
  minimum_progress_seconds: 60
  watched_ratio: 0.9
  watched_remaining_seconds: 300
  auto_play_next: false
  bangumi_writeback_enabled: true

storage:
  # qBittorrent 任务直接下载到第一个媒体库根目录下的 Subject 文件夹。
  # 可配置多个递归扫描根目录；未设置时兼容使用 library_path。
  library_path: data/library
  library_roots:
    - data/library
  quarantine_path: data/quarantine
  video_extensions: [.mkv, .mp4, .avi, .mov, .m4v, .webm, .ts]
  ffprobe_path: ffprobe
  ffprobe_enabled: true
  partial_hash_bytes: 1048576

cleanup:
  # 自动清理默认关闭；手动预览、隔离和恢复始终可用。
  enabled: false
  retention_days: 14
  quarantine_days: 7
  # 自动清理每天执行一次；仍可在 Settings 中手动立即执行。
  interval_seconds: 86400

scheduler:
  enabled: true
  # 仅处理“在看”条目中已放送、未看、缺少本地文件的 MAIN 单集。
  auto_download_enabled: false
  # 自动资源搜索每天执行一次；仍可在 Settings 中手动立即执行。
  auto_download_interval_seconds: 86400
  tick_seconds: 2
  bangumi_sync_interval_seconds: 1800
  library_scan_interval_seconds: 900
  demand_refresh_interval_seconds: 60
  download_monitor_interval_seconds: 3
  failure_backoff_seconds: 30
  failure_backoff_max_seconds: 1800
