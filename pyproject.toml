[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autoanime"
version = "0.2.1"
description = "Bangumi 自动追番与本地播放管理器"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<0.116",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "sqlalchemy>=2.0,<3",
  "starlette>=0.46,<0.47",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
